services:
  mongodb:
    image: mongo:7.0
    container_name: ruta-limpia-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ruta_limpia
    volumes:
      - ruta_limpia_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ruta_limpia_mongodb_data:
